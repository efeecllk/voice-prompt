name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Secrets are unavailable to fork and Dependabot PRs, and drafts aren't ready yet
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      # Without the token the action fails, which would mark every PR red; skip with a
      # visible notice instead until the secret is added (`claude setup-token`)
      - name: Check for Claude token
        if: env.CLAUDE_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review. Run 'claude setup-token' and 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'."

      - name: Checkout repository
        if: env.CLAUDE_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. AGENTS.md describes the project and its rules.
            Report only real problems: bugs, security issues, platform-specific breakage
            (macOS, Windows, Linux), and violations of AGENTS.md. Skip style nits and praise.
            Use inline comments for specific lines and one short summary comment. If there
            is nothing worth flagging, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
