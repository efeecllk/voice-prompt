name: Release macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: intel

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing + notarization (tauri imports the cert into a temp keychain)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Voice Prompt ${{ github.ref_name }}'
          releaseBody: |
            ## What's New

            See the changelog for details.

            ## Download

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: Download `Voice.Prompt_*_aarch64.dmg`
            - **Intel**: Download `Voice.Prompt_*_x64.dmg`

            Or install via Homebrew:
            ```bash
            brew tap efeecllk/voice-prompt
            brew install --cask voice-prompt
            ```

            ### Windows
            - `.msi` - Windows Installer (recommended)
            - `-setup.exe` - NSIS Installer

            ### Linux
            - `.deb` - Debian/Ubuntu package
            - `.AppImage` - Portable (works on most distros)

            ## Installation

            **macOS:**
            1. Download the `.dmg` file for your architecture
            2. Open it and drag Voice Prompt to Applications
            3. Open Voice Prompt from Applications

            **Windows:**
            1. Download the `.msi` installer
            2. Run the installer
            3. Open Voice Prompt from Start Menu
            4. Configure your OpenAI API key in Settings

            **Linux:**
            1. For `.deb`: `sudo dpkg -i voice-prompt_*.deb`
            2. For `.AppImage`: `chmod +x Voice_Prompt_*.AppImage && ./Voice_Prompt_*.AppImage`
            3. Configure your OpenAI API key in Settings
            4. For "Send to terminal": install `xdotool` (X11) or `wtype` (Wayland)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}
