name: Release macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: intel

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing + notarization (tauri imports the cert into a temp keychain)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Voice Prompt ${{ github.ref_name }}'
          releaseBody: |
            ## What's New

            See the changelog for details.

            ## Download

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: Download `Voice.Prompt_*_aarch64.dmg`
            - **Intel**: Download `Voice.Prompt_*_x64.dmg`

            Or install via Homebrew:
            ```bash
            brew tap efeecllk/voice-prompt
            brew install --cask voice-prompt
            ```

            ### Windows
            - `.msi` - Windows Installer (recommended)
            - `-setup.exe` - NSIS Installer

            ### Linux
            - `.deb` - Debian/Ubuntu package
            - `.AppImage` - Portable (works on most distros)

            ## Installation

            **macOS:**
            1. Download the `.dmg` file for your architecture
            2. Open it and drag Voice Prompt to Applications
            3. Open Voice Prompt from Applications

            **Windows:**
            1. Download the `.msi` installer
            2. Run the installer
            3. Open Voice Prompt from Start Menu
            4. Configure your OpenAI API key in Settings

            **Linux:**
            1. For `.deb`: `sudo dpkg -i voice-prompt_*.deb`
            2. For `.AppImage`: `chmod +x Voice_Prompt_*.AppImage && ./Voice_Prompt_*.AppImage`
            3. Configure your OpenAI API key in Settings
            4. For "Send to terminal": install `xdotool` (X11) or `wtype` (Wayland)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  update-homebrew:
    # Runs after both DMGs are uploaded. A separate `on: release` workflow never
    # fired: events caused by GITHUB_TOKEN do not trigger other workflows.
    needs: release
    # Prereleases (tags with a hyphen) are not published to the tap
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - name: Get release info
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download DMGs and calculate SHA256
        id: sha
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # ARM64 DMG
          ARM_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Voice.Prompt_${VERSION}_aarch64.dmg"
          echo "Downloading ARM64 from: $ARM_URL"
          curl -L -o arm64.dmg "$ARM_URL"
          ARM_SHA=$(shasum -a 256 arm64.dmg | cut -d' ' -f1)
          echo "arm_sha=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "ARM64 SHA256: $ARM_SHA"

          # Intel DMG (x64)
          INTEL_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Voice.Prompt_${VERSION}_x64.dmg"
          echo "Downloading Intel from: $INTEL_URL"
          if curl -L --fail -o intel.dmg "$INTEL_URL"; then
            INTEL_SHA=$(shasum -a 256 intel.dmg | cut -d' ' -f1)
            echo "intel_sha=$INTEL_SHA" >> $GITHUB_OUTPUT
            echo "Intel SHA256: $INTEL_SHA"
          else
            echo "Intel DMG not found, will use ARM64 only"
            echo "intel_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Clone Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/efeecllk/homebrew-voice-prompt.git"

      - name: Update cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha }}
        run: |
          cd homebrew-voice-prompt

          if [ -n "$INTEL_SHA" ]; then
            # Multi-architecture cask
            cat > Casks/voice-prompt.rb << 'CASK_EOF'
          cask "voice-prompt" do
            arch arm: "aarch64", intel: "x64"

          CASK_EOF
            echo "  version \"$VERSION\"" >> Casks/voice-prompt.rb
            echo "  sha256 arm:   \"$ARM_SHA\"," >> Casks/voice-prompt.rb
            echo "         intel: \"$INTEL_SHA\"" >> Casks/voice-prompt.rb
            cat >> Casks/voice-prompt.rb << 'CASK_EOF'

            url "https://github.com/efeecllk/voice-prompt/releases/download/v#{version}/Voice.Prompt_#{version}_#{arch}.dmg"
            name "Voice Prompt"
            desc "Cross-platform speech-to-text app with English translation"
            homepage "https://github.com/efeecllk/voice-prompt"

            app "Voice Prompt.app"

            caveats <<~EOS
              Voice Prompt requires an OpenAI API key to function.
              Get your API key from: https://platform.openai.com/api-keys

              After installation, click the menu bar icon and go to Settings to enter your API key.
            EOS

            zap trash: [
              "~/Library/Application Support/com.voiceprompt.app",
              "~/Library/Caches/com.voiceprompt.app",
              "~/Library/Preferences/com.voiceprompt.app.plist",
              "~/Library/Saved Application State/com.voiceprompt.app.savedState",
            ]
          end
          CASK_EOF
          else
            # ARM64-only cask (fallback)
            cat > Casks/voice-prompt.rb << 'CASK_EOF'
          cask "voice-prompt" do
          CASK_EOF
            echo "  version \"$VERSION\"" >> Casks/voice-prompt.rb
            echo "  sha256 \"$ARM_SHA\"" >> Casks/voice-prompt.rb
            cat >> Casks/voice-prompt.rb << 'CASK_EOF'

            url "https://github.com/efeecllk/voice-prompt/releases/download/v#{version}/Voice.Prompt_#{version}_aarch64.dmg"
            name "Voice Prompt"
            desc "Cross-platform speech-to-text app with English translation"
            homepage "https://github.com/efeecllk/voice-prompt"

            depends_on arch: :arm64

            app "Voice Prompt.app"

            caveats <<~EOS
              Voice Prompt requires an OpenAI API key to function.
              Get your API key from: https://platform.openai.com/api-keys

              After installation, click the menu bar icon and go to Settings to enter your API key.
            EOS

            zap trash: [
              "~/Library/Application Support/com.voiceprompt.app",
              "~/Library/Caches/com.voiceprompt.app",
              "~/Library/Preferences/com.voiceprompt.app.plist",
              "~/Library/Saved Application State/com.voiceprompt.app.savedState",
            ]
          end
          CASK_EOF
          fi

          echo "Updated cask file:"
          cat Casks/voice-prompt.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd homebrew-voice-prompt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Update to v$VERSION"
          git push
